<div class="mermaid-container">
  <div class="mermaid-toolbar">
    <span class="mermaid-label">❖ Diagram (Mermaid)</span>
    <button class="copy-code-btn" type="button" aria-label="다이어그램 소스 복사" title="소스코드 복사">
      <svg class="icon copy-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
      </svg>
      <span class="copy-text">복사</span>
    </button>
  </div>
  <div class="mermaid" data-mermaid-src="{{ .Inner | htmlEscape }}">
{{ .Inner | safeHTML }}
  </div>
</div>
