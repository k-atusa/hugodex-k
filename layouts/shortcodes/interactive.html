{{- $id := .Get "id" | default (printf "interactive-%d" (now.UnixNano)) -}}
{{- $height := .Get "height" | default "360px" -}}
{{- $title := .Get "title" | default "인터랙티브 컴포넌트" -}}
{{- $js := .Get "js" -}}
{{- $css := .Get "css" -}}

<div class="interactive-sandbox" id="{{ $id }}-container">
  <div class="sandbox-toolbar">
    <span class="sandbox-badge">
      <svg class="icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
        <polygon points="5 3 19 12 5 21 5 3"></polygon>
      </svg>
      {{ $title }}
    </span>
    <button class="sandbox-reset-btn" onclick="const f = document.getElementById('{{ $id }}-frame'); if(f) f.srcdoc = f.srcdoc;" title="컴포넌트 새로고침">
      다시 실행
    </button>
  </div>
  
  {{/* iframe srcdoc을 사용하여 포스트 스타일과 스크립트 격리 보장 */}}
  <iframe id="{{ $id }}-frame" class="sandbox-frame" style="width: 100%; height: {{ $height }}; border: none; background: var(--bg-card);"
    sandbox="allow-scripts"
    srcdoc="<!DOCTYPE html>
<html>
<head>
  <meta charset='utf-8'>
  <style>
    body { margin: 0; padding: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #24292f; background: transparent; }
    @media (prefers-color-scheme: dark) { body { color: #c9d1d9; } }
    {{ with $css }}{{ . | safeCSS }}{{ end }}
  </style>
</head>
<body>
  {{ .Inner | safeHTML }}
  {{ with $js }}<script>{{ . | safeJS }}</script>{{ end }}
</body>
</html>">
  </iframe>
</div>
