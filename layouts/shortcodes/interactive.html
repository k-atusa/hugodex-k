{{- $id := .Get "id" | default (printf "interactive-%d" (now.UnixNano)) -}}
{{- $height := .Get "height" -}}
{{- $title := .Get "title" -}}

<div class="interactive-block" id="{{ $id }}">
  {{ with $title }}
    <div class="interactive-caption">{{ . }}</div>
  {{ end }}
  <div class="interactive-body" {{ with $height }}style="min-height: {{ . }};"{{ end }}>
    {{ .Inner | safeHTML }}
  </div>
</div>
