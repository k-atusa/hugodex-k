<!DOCTYPE html>
<html lang="ko" data-theme="light">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>hugodex Editor</title>
  <link rel="stylesheet" href="../vendor/katex/katex.min.css">
  <link rel="stylesheet" href="editor.css">
  <script defer src="../vendor/katex/katex.min.js"></script>
  <script defer src="../vendor/katex/contrib/auto-render.min.js"></script>
  <script defer src="../vendor/mermaid/mermaid.min.js"></script>
</head>

<body class="editor-app">
  <!-- Top Navigation Bar -->
  <header class="app-header">
    <div class="header-left">
      <a href="../" class="nav-back-link" title="블로그 메인으로 이동">← 블로그</a>
      <div class="brand">
        <span class="brand-badge">H</span>
        <span class="brand-title">hugodex <strong>Editor</strong></span>
      </div>
    </div>

    <div class="header-center">
      <span class="active-slug" id="currentSlugDisplay" title="현재 포스트 슬러그">선택된 글 없음</span>

      <!-- Visibility Toggle Pill (공개 / 비공개) -->
      <button type="button" class="visibility-toggle public" id="visibilityToggleBtn" title="클릭하여 가시성(공개/비공개) 전환">
        <span class="vis-dot"></span>
        <span class="vis-text" id="visibilityText">공개</span>
      </button>

      <!-- Language Switcher -->
      <div class="lang-switch-group">
        <button type="button" class="lang-btn active" data-lang="ko" id="langKoBtn">KO</button>
        <button type="button" class="lang-btn" data-lang="en" id="langEnBtn">EN</button>
      </div>
    </div>

    <div class="header-right">
      <div class="status-indicator">
        <span class="status-dot synced" id="syncStatusDot"></span>
        <span class="status-text" id="syncStatusText">동기화됨</span>
      </div>
      <button type="button" class="btn btn-subtle" id="newPostBtn">＋ 새 글</button>
      <button type="button" class="btn btn-danger" id="deletePostBtn" style="display: none;">🗑 삭제</button>
      <button type="button" class="btn btn-primary" id="savePostBtn">💾 저장 <kbd>Ctrl+S</kbd></button>
    </div>
  </header>

  <!-- Main Workspace -->
  <div class="workspace-body">
    <!-- Left Sidebar: Post Manager -->
    <aside class="sidebar-pane" id="sidebarPane">
      <div class="sidebar-top">
        <div class="sidebar-heading">
          <span class="heading-title">포스트 관리</span>
          <span class="heading-count" id="sidebarCount">0</span>
        </div>
        <div class="search-wrap">
          <input type="text" id="postSearchInput" placeholder="제목 / 슬러그 / 태그 검색..." class="search-input">
        </div>
      </div>
      <div class="post-list-wrap" id="postList">
        <div class="loading-placeholder">목록 불러오는 중...</div>
      </div>
    </aside>

    <!-- Center/Right Editor & Preview -->
    <main class="editor-main-pane">
      <!-- Minimalist Metadata Strip -->
      <section class="metadata-strip">
        <div class="meta-row-title">
          <input type="text" id="postTitleInput" placeholder="게시글 제목을 입력하세요" class="title-input">
        </div>
        <div class="meta-row-details">
          <div class="meta-field">
            <span class="field-icon">📁</span>
            <input type="text" id="postCategoryInput" placeholder="단일 카테고리 (예: 분산 시스템)" class="meta-input">
          </div>
          <div class="meta-field flex-2">
            <span class="field-icon">🏷</span>
            <input type="text" id="postTagsInput" placeholder="태그 (쉼표로 구분: LaTeX, 알고리즘)" class="meta-input">
          </div>
        </div>
      </section>

      <!-- Clean Markdown Toolbar -->
      <nav class="editor-toolbar" aria-label="에디터 도구 모음">
        <div class="toolbar-group">
          <button type="button" class="tb-btn" data-action="h2" title="제목 2 (H2)">H2</button>
          <button type="button" class="tb-btn" data-action="h3" title="제목 3 (H3)">H3</button>
          <span class="tb-sep"></span>
          <button type="button" class="tb-btn" data-action="bold" title="굵게 (Ctrl+B)"><strong>B</strong></button>
          <button type="button" class="tb-btn" data-action="italic" title="기울임 (Ctrl+I)"><em>I</em></button>
          <button type="button" class="tb-btn" data-action="quote" title="인용문">&rdquo;</button>
          <button type="button" class="tb-btn" data-action="code" title="코드 블록">&lt;/&gt;</button>
          <button type="button" class="tb-btn" data-action="ul" title="글머리 기호">• 목록</button>
          <button type="button" class="tb-btn" data-action="table" title="표(Table) 삽입">⊞ 표</button>
          <button type="button" class="tb-btn" data-action="link" title="링크 삽입">🔗 링크</button>
          <button type="button" class="tb-btn" data-action="image" id="uploadImageBtn" title="이미지 업로드">🖼 이미지</button>
          <input type="file" id="imageFileInput" accept="image/*" style="display: none;">
        </div>

        <div class="toolbar-group">
          <span class="tb-sep"></span>
          <button type="button" class="tb-btn insert-math-btn" id="quickMathBtn" title="LaTeX 블록 수식 삽입">
            <span class="tb-symbol">∑</span> 수식 ($$)
          </button>
          <button type="button" class="tb-btn insert-mermaid-btn" id="quickMermaidBtn" title="Mermaid 다이어그램 삽입">
            <span class="tb-symbol">❖</span> 다이어그램
          </button>
          <button type="button" class="tb-btn insert-callout-btn" id="quickCalloutBtn" title="정리/팁 콜아웃 박스 삽입">
            <span class="tb-symbol">💡</span> 콜아웃
          </button>
          <span class="tb-sep"></span>
          <button type="button" class="tb-btn insert-svg-btn" id="quickSvgBtn" title="직접 편집 가능한 인라인 SVG 벡터 다이어그램 삽입">
            <span class="tb-symbol">📐</span> SVG
          </button>
          <button type="button" class="tb-btn insert-interactive-btn" id="quickInteractiveBtn" title="실시간 인터랙티브 HTML 컴포넌트 삽입">
            <span class="tb-symbol">⚡</span> 인터랙티브
          </button>
        </div>

        <div class="toolbar-group toolbar-group-right">
          <button type="button" class="tb-btn" id="splitViewToggleBtn" title="분할/에디터만/미리보기만 전환">
            ◫ 분할 뷰
          </button>
        </div>
      </nav>

      <!-- Split Workspace: Editor & Live Preview -->
      <div class="split-workspace" id="splitWorkspace">
        <div class="split-pane editor-pane" id="editorPane">
          <textarea id="markdownEditor" class="editor-textarea"
            placeholder="여기에 마크다운 본문을 작성하세요... (이미지 파일을 붙여넣거나 드래그 앤 드롭할 수 있습니다)" spellcheck="false"></textarea>
        </div>

        <div class="split-pane preview-pane" id="previewPane">
          <div class="preview-header">
            <span class="preview-title">실시간 미리보기</span>
            <span class="preview-badge">Live Preview</span>
          </div>
          <div class="preview-content markdown-body" id="livePreview">
            <p class="preview-placeholder">본문을 작성하면 실시간 렌더링 결과가 여기에 표시됩니다.</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- New Post Minimal Modal Dialog -->
  <div class="modal-overlay" id="newPostModal" role="dialog" aria-modal="true" aria-labelledby="newPostModalTitle">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="newPostModalTitle">새 글 작성</h3>
        <button type="button" class="modal-close-btn" aria-label="닫기">&times;</button>
      </div>
      <div class="modal-body">
        <div class="modal-field">
          <label for="newPostSlug">슬러그 (영문, 숫자, 하이픈) <span class="req">*</span></label>
          <input type="text" id="newPostSlug" placeholder="예: quantum-algorithms" class="modal-input" required>
          <span class="modal-hint">content/posts/{slug}/ 폴더가 생성됩니다.</span>
        </div>
        <div class="modal-field">
          <label for="newPostTitle">제목 <span class="req">*</span></label>
          <input type="text" id="newPostTitle" placeholder="게시글 제목" class="modal-input" required>
        </div>
        <div class="modal-field">
          <label for="newPostCategory">카테고리 (단일)</label>
          <input type="text" id="newPostCategory" placeholder="예: 분산 시스템" class="modal-input">
        </div>
        <div class="modal-field">
          <label for="newPostLang">작성 언어</label>
          <select id="newPostLang" class="modal-input modal-select">
            <option value="ko" selected>한국어 (index.md)</option>
            <option value="en">English (index.en.md)</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-subtle modal-cancel-btn">취소</button>
        <button type="button" class="btn btn-primary" id="submitNewPostBtn">생성하기</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast-bar" id="toastBar" role="alert" aria-live="assertive"></div>

  <script src="editor.js"></script>
</body>

</html>
