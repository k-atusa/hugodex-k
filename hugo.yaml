# ==============================================================================
# hugodex-k : Hugo Configuration
# ==============================================================================
title: "Blog"
baseURL: "/"
defaultContentLanguage: "ko"
defaultContentLanguageInSubdir: false
enableRobotsTXT: true
paginate: 30

params:
  author: "Author"
  description: "기록과 엔지니어링 노트"
  copyright: "© 2026. All rights reserved."
  math: true
  mermaid: true

# Exclude local editor SPA from production build
ignoreFiles:
  - "/editor/"

# Taxonomies
taxonomies:
  category: categories
  tag: tags

# Multilingual Languages
languages:
  ko:
    languageName: "한국어"
    languageCode: "ko-kr"
    weight: 1
    title: "Blog"
    params:
      description: "기록과 엔지니어링 노트"
  en:
    languageName: "English"
    languageCode: "en-us"
    weight: 2
    title: "Blog (EN)"
    params:
      description: "Engineering and writing notes"

# Markdown & Syntax Highlighting
markup:
  goldmark:
    renderer:
      unsafe: true # raw inline HTML 허용
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - ['\[', '\]']
            - ['$$', '$$']
          inline:
            - ['\(', '\)']
            - ['$', '$']
      table: true
      strikethrough: true
      linkify: true
      taskLists: true
      typographer: false
  highlight:
    codeFences: true
    guessSyntax: true
    lineNos: false
    noClasses: false
    style: "github"
  tableOfContents:
    startLevel: 2
    endLevel: 4
    ordered: false
