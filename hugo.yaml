baseURL: "/"
title: "Blog"
defaultContentLanguage: "ko"
defaultContentLanguageInSubdir: false
enableRobotsTXT: true
summaryLength: 60

# Exclude local editor SPA from production build
ignoreFiles:
  - "/editor/"

# Taxonomies
taxonomies:
  category: categories
  tag: tags

# Languages
languages:
  ko:
    languageName: "한국어"
    languageCode: "ko-kr"
    weight: 1
    title: "Blog"
    params:
      description: "엔지니어링, 프로그래밍, 수학 노트"
    menu:
      main:
        - identifier: posts
          name: "글 목록"
          url: "/posts/"
          weight: 10
        - identifier: categories
          name: "카테고리"
          url: "/categories/"
          weight: 20
        - identifier: tags
          name: "태그"
          url: "/tags/"
          weight: 30
  en:
    languageName: "English"
    languageCode: "en-us"
    weight: 2
    title: "Blog (EN)"
    params:
      description: "Engineering, programming and mathematics notes"
    menu:
      main:
        - identifier: posts
          name: "Posts"
          url: "/en/posts/"
          weight: 10
        - identifier: categories
          name: "Categories"
          url: "/en/categories/"
          weight: 20
        - identifier: tags
          name: "Tags"
          url: "/en/tags/"
          weight: 30

# Markdown & Syntax Highlighting
markup:
  goldmark:
    renderer:
      unsafe: true # raw inline HTML 허용
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - ['\[', '\]']
            - ['$$', '$$']
          inline:
            - ['\(', '\)']
            - ['$', '$']
      table: true
      strikethrough: true
      linkify: true
      taskLists: true
      typographer: false
  highlight:
    codeFences: true
    guessSyntax: true
    lineNos: false # GitHub 마크다운처럼 기본 줄번호 없이 깔끔하게
    noClasses: false # CSS 클래스 기반 하이라이팅
    style: "github"
  tableOfContents:
    startLevel: 2
    endLevel: 4
    ordered: false

# Site Params
params:
  siteName: "Blog"
  copyright: "© 2026. All rights reserved."
  math: true
  mermaid: true

# Top-level Menu Fallback
menu:
  main:
    - identifier: posts
      name: "글 목록"
      url: "/posts/"
      weight: 10
    - identifier: categories
      name: "카테고리"
      url: "/categories/"
      weight: 20
    - identifier: tags
      name: "태그"
      url: "/tags/"
      weight: 30
