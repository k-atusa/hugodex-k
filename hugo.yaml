baseURL: "/"
title: "hugodex-k"
defaultContentLanguage: "ko"
defaultContentLanguageInSubdir: false
enableRobotsTXT: true
summaryLength: 50

# Exclude local editor from production build
ignoreFiles:
  - "/editor/"

# Taxonomies
taxonomies:
  category: categories
  tag: tags

# Languages (ko weight 1, en weight 2)
languages:
  ko:
    languageName: "한국어"
    languageCode: "ko-kr"
    weight: 1
    title: "hugodex-k"
    params:
      description: "프로그래밍, 고급 수학, 구조도 다이어그램 정적 지식 블로그"
    menu:
      main:
        - identifier: posts
          name: "포스트"
          url: "/posts/"
          weight: 10
        - identifier: categories
          name: "카테고리"
          url: "/categories/"
          weight: 20
        - identifier: tags
          name: "태그"
          url: "/tags/"
          weight: 30
  en:
    languageName: "English"
    languageCode: "en-us"
    weight: 2
    title: "hugodex-k (EN)"
    params:
      description: "Static knowledge blog specialized in programming, advanced mathematics, and system diagrams"
    menu:
      main:
        - identifier: posts
          name: "Posts"
          url: "/en/posts/"
          weight: 10
        - identifier: categories
          name: "Categories"
          url: "/en/categories/"
          weight: 20
        - identifier: tags
          name: "Tags"
          url: "/en/tags/"
          weight: 30

# Markup Configuration
markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - ['\[', '\]']
            - ['$$', '$$']
          inline:
            - ['\(', '\)']
            - ['$', '$']
      table: true
      strikethrough: true
      linkify: true
      taskLists: true
      typographer: false
  highlight:
    codeFences: true
    guessSyntax: true
    lineNos: true
    lineNumbersInTable: true
    noClasses: false
    style: "monokai"
  tableOfContents:
    startLevel: 2
    endLevel: 4
    ordered: false

# Site Params
params:
  siteName: "hugodex-k"
  copyright: "© 2026 hugodex-k. All rights reserved."
  math: true
  mermaid: true

# Top-level Menu Fallback
menu:
  main:
    - identifier: posts
      name: "포스트"
      url: "/posts/"
      weight: 10
    - identifier: categories
      name: "카테고리"
      url: "/categories/"
      weight: 20
    - identifier: tags
      name: "태그"
      url: "/tags/"
      weight: 30
