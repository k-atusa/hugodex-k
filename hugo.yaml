# ==============================================================================
# [사용자 블로그 기본 설정] - 여기를 수정하여 블로그 정보를 변경하세요
# ==============================================================================
title: "Blog"
baseURL: "/"
defaultContentLanguage: "ko"
defaultContentLanguageInSubdir: false
enableRobotsTXT: true
paginate: 30                     # 기본 30개 포스트 표시

params:
  siteName: "Blog"
  author: "Author"
  description: "기록과 엔지니어링 노트"
  copyright: "© 2026. All rights reserved."
  math: true                     # KaTeX 수식 지원 (필요시 false)
  mermaid: true                  # Mermaid 다이어그램 지원 (필요시 false)

# Exclude local editor SPA from production build
ignoreFiles:
  - "/editor/"

# Taxonomies
taxonomies:
  category: categories
  tag: tags

# Languages
languages:
  ko:
    languageName: "한국어"
    languageCode: "ko-kr"
    weight: 1
    title: "Blog"
    params:
      description: "기록과 엔지니어링 노트"
    menu:
      main:
        - identifier: posts
          name: "글 목록"
          url: "/posts/"
          weight: 10
        - identifier: categories
          name: "카테고리"
          url: "/categories/"
          weight: 20
        - identifier: tags
          name: "태그"
          url: "/tags/"
          weight: 30
  en:
    languageName: "English"
    languageCode: "en-us"
    weight: 2
    title: "Blog (EN)"
    params:
      description: "Engineering and writing notes"
    menu:
      main:
        - identifier: posts
          name: "Posts"
          url: "/en/posts/"
          weight: 10
        - identifier: categories
          name: "Categories"
          url: "/en/categories/"
          weight: 20
        - identifier: tags
          name: "Tags"
          url: "/en/tags/"
          weight: 30

# Markdown & Syntax Highlighting
markup:
  goldmark:
    renderer:
      unsafe: true # raw inline HTML 허용
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - ['\[', '\]']
            - ['$$', '$$']
          inline:
            - ['\(', '\)']
            - ['$', '$']
      table: true
      strikethrough: true
      linkify: true
      taskLists: true
      typographer: false
  highlight:
    codeFences: true
    guessSyntax: true
    lineNos: false # GitHub 스타일 깔끔한 코드 블록
    noClasses: false
    style: "github"
  tableOfContents:
    startLevel: 2
    endLevel: 4
    ordered: false

# Top-level Menu Fallback
menu:
  main:
    - identifier: posts
      name: "글 목록"
      url: "/posts/"
      weight: 10
    - identifier: categories
      name: "카테고리"
      url: "/categories/"
      weight: 20
    - identifier: tags
      name: "태그"
      url: "/tags/"
      weight: 30
